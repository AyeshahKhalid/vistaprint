<div class="faq-accordion">
  @for (item of items; track item.question; let i = $index) {
    <div class="faq-item" [class.faq-item--open]="openIndex() === i">
      <button type="button" class="faq-item__question" (click)="toggle(i)" [attr.aria-expanded]="openIndex() === i">
        {{ item.question }}
        <svg class="faq-item__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      @if (openIndex() === i) {
        <p class="faq-item__answer">{{ item.answer }}</p>
      }
    </div>
  }
</div>
