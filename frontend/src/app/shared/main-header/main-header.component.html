<div class="main-header">
  <div class="main-header__inner">
    <a routerLink="/" class="main-header__logo">
      <img src="/images/shared/logo.png" alt="PRINTGRAPHI" />
    </a>

    <div class="main-header__search">
      <svg class="main-header__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        class="main-header__search-input"
        placeholder="Search for business cards, banners, invitations..."
      />
      <button type="button" class="main-header__search-btn">Search</button>
    </div>

    <nav class="main-header__actions">
      <button type="button" class="main-header__action" aria-label="Help">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>
      <button type="button" class="main-header__action" aria-label="Favorites">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>
        </svg>
      </button>
      <button type="button" class="main-header__action" aria-label="My Projects">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="main-header__action-label">My Projects</span>
      </button>
      <a routerLink="/cart" class="main-header__action main-header__action--cart" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        @if (cart.count() > 0) {
          <span class="main-header__badge">{{ cart.count() }}</span>
        }
      </a>
    </nav>
  </div>
</div>
